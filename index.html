<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>포트폴리오</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">

    <!-- 흰 큰 카드: 왼쪽 ABOUT ME + 오른쪽 PORTFOLIO -->
    <div class="sheet">

      <!-- 왼쪽: ABOUT ME -->
      <aside class="about">
        <p class="about-label">ABOUT ME</p>

        <div class="photo" id="photo">
          <span class="photo-empty">사진</span>
        </div>

        <h2 class="name" id="name"></h2>
        <p class="job-title" id="job-title"></p>
        <p class="badge" id="career-badge"></p>

        <ul class="info">
          <li>
            <span class="info-icon">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
            </span>
            <span class="info-text"><small>이름</small><span id="info-name"></span></span>
          </li>
          <li>
            <span class="info-icon">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
            </span>
            <span class="info-text"><small>이메일</small><span id="info-email"></span></span>
          </li>
          <li>
            <span class="info-icon">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h4l2 5-2.5 1.5a11 11 0 0 0 6 6L16 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 5a2 2 0 0 1 2-2z"/></svg>
            </span>
            <span class="info-text"><small>연락처</small><span id="info-phone"></span></span>
          </li>
          <li>
            <span class="info-icon">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>
            </span>
            <span class="info-text"><small>위치</small><span id="info-location"></span></span>
          </li>
        </ul>
      </aside>

      <!-- 오른쪽: PORTFOLIO -->
      <section class="content">
        <h1 class="big-title">PORTFOLIO</h1>

        <h2 class="headline" id="headline"></h2>
        <p class="intro" id="intro"></p>

        <div class="facts">
          <div class="fact">
            <p class="fact-title">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c0 1.5 2.7 3 6 3s6-1.5 6-3v-5"/></svg>
              EDUCATION
            </p>
            <p class="fact-text" id="education"></p>
          </div>
          <div class="fact">
            <p class="fact-title">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/></svg>
              SKILLS &amp; TOOLS
            </p>
            <p class="fact-text" id="skills"></p>
          </div>
          <div class="fact">
            <p class="fact-title">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/><path d="M3 13h18"/></svg>
              EXPERIENCE
            </p>
            <p class="fact-text" id="experience"></p>
          </div>
        </div>

        <div class="highlights">
          <p class="highlights-title">PORTFOLIO HIGHLIGHTS</p>
          <div class="cards" id="cards">
            <p class="notice">불러오는 중…</p>
          </div>
        </div>

        <p class="quote" id="quote"></p>
      </section>
    </div>

    <!-- 흰 카드 아래: 방명록 -->
    <section class="sheet guestbook">
      <h2 class="big-title">GUESTBOOK</h2>

      <div class="gb-form">
        <input type="text" id="gb-nickname" placeholder="별명 (20자까지)" maxlength="20">
        <input type="text" id="gb-message" placeholder="한마디를 남겨 주세요 (200자까지)" maxlength="200">
        <button type="button" id="gb-submit">남기기</button>
      </div>
      <p class="gb-status" id="gb-status"></p>

      <ul class="gb-list" id="gb-list">
        <li class="notice">불러오는 중…</li>
      </ul>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>

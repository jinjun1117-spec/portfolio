<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>관리자 · 포트폴리오</title>
  <!-- 색·글꼴·카드 모양은 방문자 화면과 같은 style.css를 쓴다 -->
  <link rel="stylesheet" href="style.css">
  <style>
    /* ===== 관리자 화면에만 쓰는 모양 ===== */
    .admin-page {
      max-width: 960px;
    }

    .box {
      background: var(--white);
      border-radius: 24px;
      box-shadow: 0 10px 40px rgba(17, 24, 39, 0.08);
      padding: 36px 40px;
      margin-bottom: 28px;
    }

    .box .big-title {
      font-size: 28px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 28px;
    }

    .topbar .big-title {
      margin: 0;
    }

    .topbar a {
      color: var(--gray);
      font-size: 14px;
    }

    .who {
      color: var(--gray);
      font-size: 14px;
    }

    .fields {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 13px;
      font-weight: 700;
      color: var(--gray);
    }

    .field.wide {
      grid-column: 1 / -1;
    }

    .field input,
    .field textarea {
      padding: 11px 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      font: inherit;
      font-size: 15px;
      font-weight: 400;
      color: var(--text);
    }

    .field textarea {
      min-height: 84px;
      resize: vertical;
    }

    .field input:focus,
    .field textarea:focus {
      outline: 2px solid var(--blue);
      border-color: transparent;
    }

    .field small {
      font-weight: 400;
    }

    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 12px;
      background: var(--blue);
      color: var(--white);
      font: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn.light {
      background: var(--chip);
      color: var(--text);
    }

    .btn.danger {
      background: #fff1f2;
      color: #e11d48;
    }

    .btn.small {
      padding: 6px 12px;
      border-radius: 10px;
      font-size: 13px;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: default;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-top: 20px;
    }

    .msg {
      font-size: 14px;
      color: var(--blue);
    }

    .msg.error {
      color: #dc2626;
    }

    .photo-row {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .photo-preview {
      flex: none;
      width: 88px;
      height: 88px;
      border-radius: 16px;
      background: #d9dde3;
      overflow: hidden;
    }

    .photo-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .current-file {
      font-weight: 400;
      word-break: break-all;
    }

    /* 카드 · 좋아요 · 방명록 목록 */
    .rows {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 10px;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: 14px;
    }

    .row-thumb {
      flex: none;
      width: 72px;
      aspect-ratio: 16 / 10;
      border-radius: 8px;
      background: #d9dde3;
      overflow: hidden;
    }

    .row-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .row-main {
      flex: 1;
      min-width: 0;
    }

    .row-main p {
      margin: 0;
      word-break: break-word;
    }

    .row-sub {
      color: var(--gray);
      font-size: 13px;
    }

    .row-buttons {
      flex: none;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: flex-end;
    }

    .count {
      flex: none;
      font-weight: 800;
      color: #e11d48;
    }

    .editor {
      margin-top: 20px;
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: #fafbfc;
    }

    .editor h3 {
      margin: 0 0 16px;
    }

    .login {
      max-width: 420px;
      margin: 40px auto;
    }

    .login .fields {
      grid-template-columns: 1fr;
    }

    [hidden] {
      display: none !important;
    }

    @media (max-width: 760px) {
      .box {
        padding: 24px 20px;
      }

      .fields {
        grid-template-columns: 1fr;
      }

      .row {
        flex-wrap: wrap;
      }

      .row-buttons {
        width: 100%;
        justify-content: flex-start;
      }
    }
  </style>
</head>
<body>
  <main class="page admin-page">

    <!-- 1) 로그인 화면 -->
    <section class="box login" id="login-view" hidden>
      <h1 class="big-title">ADMIN</h1>
      <div class="fields">
        <label class="field">이메일
          <input type="email" id="login-email" autocomplete="username">
        </label>
        <label class="field">비밀번호
          <input type="password" id="login-password" autocomplete="current-password">
        </label>
      </div>
      <div class="actions">
        <button type="button" class="btn" id="login-button">로그인</button>
        <span class="msg error" id="login-msg"></span>
      </div>
    </section>

    <!-- 2) 관리자가 아닐 때 -->
    <section class="box login" id="denied-view" hidden>
      <h1 class="big-title">ADMIN</h1>
      <p>관리자만 쓸 수 있어요.</p>
      <div class="actions">
        <button type="button" class="btn light" id="denied-logout">로그아웃</button>
      </div>
    </section>

    <!-- 3) 관리자 화면 -->
    <div id="admin-view" hidden>
      <div class="topbar">
        <h1 class="big-title">ADMIN</h1>
        <div class="actions" style="margin: 0;">
          <span class="who" id="who"></span>
          <a href="index.html" target="_blank">방문자 화면 보기</a>
          <button type="button" class="btn light small" id="logout-button">로그아웃</button>
        </div>
      </div>

      <!-- 프로필 -->
      <section class="box">
        <h2 class="big-title">프로필</h2>
        <div class="fields">
          <div class="field wide">프로필 사진
            <div class="photo-row">
              <div class="photo-preview" id="photo-preview"></div>
              <div>
                <input type="file" id="photo-file" accept="image/png,image/jpeg,image/webp,image/gif">
                <br><small>이미지(PNG·JPG·WEBP·GIF), 10MB까지. 저장을 누르면 올라가요.</small>
              </div>
            </div>
          </div>
          <label class="field">이름 <input type="text" data-profile="name"></label>
          <label class="field">직함 <input type="text" data-profile="title"></label>
          <label class="field">경력 배지 <input type="text" data-profile="career_badge"></label>
          <label class="field">이메일 <input type="text" data-profile="email"></label>
          <label class="field">연락처 <input type="text" data-profile="phone"></label>
          <label class="field">위치 <input type="text" data-profile="location"></label>
          <label class="field wide">한 줄 소개 제목 <small>(이름이 들어가면 방문자 화면에서 이름에 파란 밑줄이 생겨요)</small>
            <input type="text" data-profile="headline">
          </label>
          <label class="field wide">소개 글 <textarea data-profile="intro"></textarea></label>
          <label class="field">EDUCATION <textarea data-profile="education"></textarea></label>
          <label class="field">SKILLS &amp; TOOLS <textarea data-profile="skills"></textarea></label>
          <label class="field">EXPERIENCE <textarea data-profile="experience"></textarea></label>
          <label class="field">맨 아래 인용 <textarea data-profile="quote"></textarea></label>
        </div>
        <div class="actions">
          <button type="button" class="btn" id="profile-save">프로필 저장</button>
          <span class="msg" id="profile-msg"></span>
        </div>
      </section>

      <!-- 포트폴리오 카드 -->
      <section class="box">
        <h2 class="big-title">포트폴리오 카드</h2>
        <ul class="rows" id="project-list"></ul>
        <div class="actions">
          <button type="button" class="btn" id="project-new">+ 카드 추가</button>
          <span class="msg" id="project-msg"></span>
        </div>

        <!-- 카드 추가·수정 폼 -->
        <div class="editor" id="project-editor" hidden>
          <h3 id="editor-title">카드 추가</h3>
          <div class="fields">
            <label class="field">번호 <input type="text" id="p-number" placeholder="01"></label>
            <label class="field">분류 <input type="text" id="p-category"></label>
            <label class="field wide">제목 (꼭 적기) <input type="text" id="p-title"></label>
            <label class="field wide">설명 <textarea id="p-description"></textarea></label>
            <label class="field wide">태그 <small>(쉼표로 나눠 적기. 예: 총괄 PM, UI/UX)</small>
              <input type="text" id="p-tags">
            </label>
            <div class="field">썸네일 이미지
              <input type="file" id="p-thumb" accept="image/png,image/jpeg,image/webp,image/gif">
              <small class="current-file" id="p-thumb-current"></small>
            </div>
            <div class="field">첨부 파일 (이미지 또는 PDF)
              <input type="file" id="p-file" accept="image/png,image/jpeg,image/webp,image/gif,application/pdf">
              <small class="current-file" id="p-file-current"></small>
            </div>
          </div>
          <p class="row-sub">파일은 10MB까지. 새 파일을 고르지 않으면 지금 파일이 그대로 남아요.</p>
          <div class="actions">
            <button type="button" class="btn" id="project-save">저장</button>
            <button type="button" class="btn light" id="project-cancel">취소</button>
            <span class="msg" id="editor-msg"></span>
          </div>
        </div>
      </section>

      <!-- 좋아요 -->
      <section class="box">
        <h2 class="big-title">좋아요</h2>
        <ul class="rows" id="like-list"></ul>
        <p class="msg" id="like-msg"></p>
      </section>

      <!-- 방명록 -->
      <section class="box">
        <h2 class="big-title">방명록</h2>
        <ul class="rows" id="guest-list"></ul>
        <p class="msg" id="guest-msg"></p>
      </section>
    </div>

  </main>

  <script src="admin.js"></script>
</body>
</html>
